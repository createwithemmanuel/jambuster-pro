<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMBuster Admin 🇳🇬</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a202c;
        }

        .header h1 span {
            color: #008751;
        }

        .header .admin-badge {
            background: #008751;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .header .logout-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .header .logout-btn:hover {
            background: #fde8e8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .stat-card .icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1a202c;
        }

        .stat-card .label {
            color: #718096;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .stat-card .trend {
            font-size: 0.8rem;
            margin-top: 6px;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .trend.up {
            background: #e8f5e9;
            color: #008751;
        }

        .trend.down {
            background: #fde8e8;
            color: #e74c3c;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .chart-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 16px;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 180px;
            padding-top: 10px;
        }

        .chart-bar {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .chart-bar .bar {
            width: 100%;
            max-width: 40px;
            background: #008751;
            border-radius: 6px 6px 0 0;
            min-height: 4px;
            transition: height 0.6s ease;
            height: 20px;
        }

        .chart-bar .bar-label {
            font-size: 0.65rem;
            color: #718096;
            font-weight: 500;
        }

        .subject-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .subject-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subject-row .subject-name {
            width: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a202c;
        }

        .subject-row .subject-bar {
            flex: 1;
            height: 24px;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .subject-row .subject-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #008751, #00a86b);
            border-radius: 12px;
            transition: width 0.6s ease;
            width: 0%;
        }

        .subject-row .subject-count {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a202c;
            min-width: 40px;
            text-align: right;
        }

        .users-table {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        .users-table h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 16px;
        }

        .users-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .users-table th {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 2px solid #e2e8f0;
            color: #718096;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .users-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #f0f2f5;
            color: #1a202c;
        }

        .users-table .badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge.premium {
            background: #e8f5e9;
            color: #008751;
        }

        .badge.free {
            background: #f0f2f5;
            color: #718096;
        }

        .badge.admin {
            background: #fde8e8;
            color: #e74c3c;
        }

        .upgrade-btn {
            padding: 4px 12px;
            background: #008751;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .upgrade-btn:hover {
            background: #006b3f;
            transform: scale(1.05);
        }

        .refresh-btn {
            padding: 8px 16px;
            background: #008751;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #006b3f;
        }

        .loading-text {
            color: #718096;
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
        }

        .error-text {
            color: #e74c3c;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stat-card .number {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        
        <!-- Header -->
        <div class="header">
            <h1>🇳🇬 JAMB<span>uster</span> <span style="font-size:0.8rem; color:#718096; font-weight:500;">Admin Panel</span></h1>
            <div style="display:flex; align-items:center; gap:16px;">
                <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>
                <span class="admin-badge">👑 Admin</span>
                <button class="logout-btn" onclick="logoutAdmin()">🚪 Logout</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="number" id="totalUsers">-</div>
                <div class="label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="icon">🆕</div>
                <div class="number" id="newUsersToday">-</div>
                <div class="label">New Users Today</div>
            </div>
            <div class="stat-card">
                <div class="icon">⭐</div>
                <div class="number" id="premiumUsers">-</div>
                <div class="label">Premium Users</div>
            </div>
            <div class="stat-card">
                <div class="icon">💬</div>
                <div class="number" id="totalChats">-</div>
                <div class="label">Total Questions Asked</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="number" id="activeUsers">-</div>
                <div class="label">Active Users (7 days)</div>
            </div>
            <div class="stat-card">
                <div class="icon">📈</div>
                <div class="number" id="chatsToday">-</div>
                <div class="label">Questions Today</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-row">
            <div class="chart-card">
                <h3>📈 User Growth (Last 7 Days)</h3>
                <div class="chart-bars" id="growthChart">
                    <div class="loading-text">Loading...</div>
                </div>
            </div>
            <div class="chart-card">
                <h3>📚 Subject Popularity</h3>
                <div class="subject-stats" id="subjectStats">
                    <div class="loading-text">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="users-table">
            <h3>👥 Recent Users</h3>
            <div id="usersTableContent">
                <div class="loading-text">Loading users...</div>
            </div>
        </div>

    </div>

    <script>
        // ============================================
        // STATE
        // ============================================
        let adminToken = localStorage.getItem('jambuster_token');
        let adminUsername = localStorage.getItem('jambuster_username');

        // ============================================
        // LOAD DASHBOARD
        // ============================================
        async function loadDashboard() {
            if (!adminToken) {
                window.location.href = '/';
                return;
            }

            try {
                // Load stats
                const statsRes = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });
                const statsData = await statsRes.json();

                if (statsData.success) {
                    const s = statsData.stats;
                    document.getElementById('totalUsers').textContent = s.total_users;
                    document.getElementById('newUsersToday').textContent = s.new_users_today;
                    document.getElementById('premiumUsers').textContent = s.premium_users;
                    document.getElementById('totalChats').textContent = s.total_chats;
                    document.getElementById('activeUsers').textContent = s.active_users_7d;
                    document.getElementById('chatsToday').textContent = s.chats_today;
                    
                    // Render growth chart
                    renderGrowthChart(s.growth);
                    
                    // Render subject stats
                    renderSubjectStats(s.subject_stats);
                }

                // Load users
                const usersRes = await fetch('/api/admin/users?limit=20', {
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });
                const usersData = await usersRes.json();
                
                if (usersData.success) {
                    renderUsersTable(usersData.users);
                }

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('statsGrid').innerHTML = '<div class="error-text">❌ Failed to load data. Make sure server is running.</div>';
            }
        }

        // ============================================
        // RENDER GROWTH CHART
        // ============================================
        function renderGrowthChart(growth) {
            const container = document.getElementById('growthChart');
            
            if (!growth || growth.length === 0) {
                container.innerHTML = '<div class="loading-text">No data yet</div>';
                return;
            }

            const maxVal = Math.max(...growth.map(d => d.count), 1);
            
            container.innerHTML = growth.map(d => `
                <div class="chart-bar">
                    <div class="bar" style="height: ${(d.count / maxVal) * 150 + 10}px;"></div>
                    <div class="bar-label">${d.date}</div>
                    <div style="font-size:0.6rem; color:#1a202c; font-weight:600;">${d.count}</div>
                </div>
            `).join('');
        }

        // ============================================
        // RENDER SUBJECT STATS
        // ============================================
        function renderSubjectStats(subjectStats) {
            const container = document.getElementById('subjectStats');
            
            if (!subjectStats || Object.keys(subjectStats).length === 0) {
                container.innerHTML = '<div style="color:#718096;">No questions asked yet</div>';
                return;
            }

            const total = Object.values(subjectStats).reduce((a, b) => a + b, 0);
            const colors = ['#008751', '#00a86b', '#4caf50', '#81c784'];
            
            let html = '';
            let index = 0;
            for (const [subject, count] of Object.entries(subjectStats)) {
                const percentage = total > 0 ? (count / total) * 100 : 0;
                const color = colors[index % colors.length];
                html += `
                    <div class="subject-row">
                        <div class="subject-name">${subject.charAt(0).toUpperCase() + subject.slice(1)}</div>
                        <div class="subject-bar">
                            <div class="fill" style="width: ${percentage}%; background: ${color};"></div>
                        </div>
                        <div class="subject-count">${count}</div>
                    </div>
                `;
                index++;
            }
            
            container.innerHTML = html;
        }

        // ============================================
        // RENDER USERS TABLE
        // ============================================
        function renderUsersTable(users) {
            const container = document.getElementById('usersTableContent');
            
            if (!users || users.length === 0) {
                container.innerHTML = '<div style="color:#718096; padding:20px; text-align:center;">No users yet</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                const status = user.is_admin ? 'admin' : (user.is_premium ? 'premium' : 'free');
                const statusClass = user.is_admin ? 'admin' : (user.is_premium ? 'premium' : 'free');
                const joined = new Date(user.created_at).toLocaleDateString();
                
                html += `
                    <tr>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.email || '—'}</td>
                        <td><span class="badge ${statusClass}">${status.toUpperCase()}</span></td>
                        <td>${joined}</td>
                        <td>
                            ${!user.is_premium && !user.is_admin ? 
                                `<button class="upgrade-btn" onclick="upgradeUser(${user.id})">⬆ Upgrade</button>` : 
                                '—'
                            }
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================
        // UPGRADE USER
        // ============================================
        async function upgradeUser(userId) {
            if (!confirm('Upgrade this user to premium?')) return;
            
            try {
                const response = await fetch(`/api/admin/upgrade/${userId}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ User upgraded to premium!');
                    loadDashboard();
                } else {
                    alert('❌ Failed: ' + data.error);
                }
            } catch (error) {
                alert('Network error');
            }
        }

        // ============================================
        // LOGOUT
        // ============================================
        function logoutAdmin() {
            localStorage.removeItem('jambuster_token');
            localStorage.removeItem('jambuster_username');
            window.location.href = '/';
        }

        // ============================================
        // AUTO-LOAD ON PAGE LOAD
        // ============================================
        window.addEventListener('load', loadDashboard);

        // Auto-refresh every 60 seconds
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>
