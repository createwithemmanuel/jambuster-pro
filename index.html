<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMBuster Pro 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #008751;
            --primary-dark: #006b3f;
            --primary-light: #e8f5e9;
            --bg: #f7f9fc;
            --sidebar-bg: #0a0a0f;
            --sidebar-text: #e0e0e0;
            --sidebar-hover: #1a1a2e;
            --border: #e2e8f0;
            --text: #1a202c;
            --text-light: #718096;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            margin-bottom: 16px;
        }
        .sidebar .brand h2 { color: white; font-size: 1.2rem; font-weight: 800; }
        .sidebar .brand h2 span { color: var(--primary); }

        .sidebar .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 16px;
        }
        .sidebar .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .sidebar .section-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 12px;
        }

        .sidebar .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .sidebar .chat-item {
            padding: 10px 12px;
            color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .chat-item:hover {
            background: var(--sidebar-hover);
            color: white;
        }
        .sidebar .chat-item.active {
            background: rgba(0, 135, 81, 0.25);
            color: white;
        }
        .sidebar .chat-item .title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 12px;
            margin-top: 8px;
        }

        .sidebar .user-info-sidebar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
        }
        .sidebar .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }
        .sidebar .user-info-sidebar .username {
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            flex: 1;
        }

        /* ========== MAIN CHAT ========== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
        }

        /* Mobile header */
        .mobile-header {
            display: none;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: white;
            gap: 12px;
        }
        .mobile-header .hamburger-mobile {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            color: var(--text);
        }

        /* Welcome Screen */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .welcome-screen .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-screen h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #008751, #00a86b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .welcome-screen .subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 500px;
            line-height: 1.7;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            padding: 10px 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }
        .quick-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-messages .message {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 18px;
            animation: fadeIn 0.3s ease;
            line-height: 1.7;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .chat-messages .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        .chat-messages .message.ai {
            background: var(--bg);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border);
        }
        .chat-messages .message .time {
            font-size: 0.65rem;
            opacity: 0.5;
            display: block;
            margin-top: 6px;
        }

        .chat-messages .typing-indicator {
            align-self: flex-start;
            background: var(--bg);
            padding: 12px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border);
            display: none;
        }
        .chat-messages .typing-indicator.show { display: block; }
        .chat-messages .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--text-light);
            border-radius: 50%;
            margin: 0 3px;
            animation: typing 1.4s infinite both;
        }
        .chat-messages .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .chat-messages .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 16px 32px 24px;
            border-top: 1px solid var(--border);
            background: white;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 4px 6px 4px 18px;
            transition: all 0.3s;
        }
        .input-area .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 135, 81, 0.1);
        }
        .input-area .input-wrapper input {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            outline: none;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }
        .input-area .input-wrapper input::placeholder { color: var(--text-light); }

        .input-area .input-wrapper .voice-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.3s;
            color: var(--text-light);
        }
        .input-area .input-wrapper .voice-btn:hover {
            background: rgba(0, 135, 81, 0.1);
            color: var(--primary);
        }
        .input-area .input-wrapper .voice-btn.recording {
            color: #e74c3c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .input-area .send-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            min-width: 80px;
        }
        .input-area .send-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.03);
        }
        .input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Follow-up buttons */
        .follow-ups-container {
            align-self: flex-start;
            margin: 8px 0 4px 0;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 85%;
            animation: fadeIn 0.5s ease;
        }
        .follow-ups-container .label {
            color: var(--text-light);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .follow-ups-container .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .follow-ups-container .follow-btn {
            padding: 6px 14px;
            font-size: 0.8rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }
        .follow-ups-container .follow-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 100;
                box-shadow: 2px 0 20px rgba(0,0,0,0.3);
                transition: left 0.3s ease;
            }
            .sidebar.mobile-open { left: 0; }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.4);
                z-index: 99;
            }
            .sidebar-overlay.show { display: block; }

            .mobile-header { display: flex !important; }
            .welcome-screen h1 { font-size: 2rem; }
            .chat-messages { padding: 16px; }
            .chat-messages .message { max-width: 95%; }
            .input-area { padding: 12px 16px 16px; }
            .quick-actions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

<!-- ============================================
SIDEBAR OVERLAY (Mobile)
============================================ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ============================================
SIDEBAR
============================================ -->
<div class="sidebar" id="sidebar">
    <div class="brand">
        <span style="font-size:1.5rem;">🇳🇬</span>
        <h2>JAMB<span>uster</span></h2>
    </div>

    <button class="new-chat-btn" onclick="newChat()">
        <span>+</span> New Chat
    </button>

    <div class="section-label">Recent Chats</div>
    <div class="chat-list" id="chatList">
        <!-- Chat items appear here -->
    </div>

    <div class="sidebar-footer">
        <div class="user-info-sidebar">
            <div class="user-avatar">👤</div>
            <span class="username">Guest</span>
        </div>
    </div>
</div>

<!-- ============================================
MAIN CHAT
============================================ -->
<div class="main-chat">

    <!-- Mobile Header -->
    <div class="mobile-header">
        <button class="hamburger-mobile" onclick="openSidebar()">☰</button>
        <span style="font-weight:700; font-size:1.1rem; color:var(--primary);">🇳🇬 JAMBuster</span>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" id="chatMessages">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">🚀</div>
            <h1>Welcome to JAMBuster!</h1>
            <p class="subtitle">
                Your AI-powered JAMB tutor that speaks <strong>Pidgin English</strong>.<br>
                Ask questions, get instant answers, and ace your exams!
            </p>
            <div class="quick-actions">
                <button class="quick-btn" onclick="quickQuestion('Explain photosynthesis in Pidgin')">🌿 Photosynthesis</button>
                <button class="quick-btn" onclick="quickQuestion('Solve 2x + 5 = 13 in Pidgin')">📐 Algebra</button>
                <button class="quick-btn" onclick="quickQuestion('Explain Newton\'s laws in Pidgin')">⚡ Physics</button>
                <button class="quick-btn" onclick="quickQuestion('What is the periodic table?')">🧪 Chemistry</button>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <button class="hamburger-mobile" onclick="openSidebar()" style="display:none; background:none; border:none; font-size:1.5rem; cursor:pointer; padding:4px;">☰</button>
        <div class="input-wrapper">
            <input type="text" id="questionInput" placeholder="Ask anything in Pidgin English..." />
            <button class="voice-btn" id="voiceBtn" onclick="startVoice()" title="Voice input">🎤</button>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendQuestion()">Send →</button>
    </div>
</div>

<!-- ============================================
JAVASCRIPT
============================================ -->
<script>
    // ============================================
    // STATE
    // ============================================
    let currentSubject = 'general';
    let isRecording = false;
    let recognition = null;
    let chatCounter = 0;

    // ============================================
    // DOM ELEMENTS
    // ============================================
    const chatMessages = document.getElementById('chatMessages');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const chatList = document.getElementById('chatList');

    // ============================================
    // SEND QUESTION
    // ============================================
    questionInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendQuestion();
    });
    sendBtn.addEventListener('click', sendQuestion);

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question) return;

        welcomeScreen.style.display = 'none';
        questionInput.value = '';
        sendBtn.disabled = true;
        typingIndicator.classList.add('show');

        addMessage('user', question);

        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        aiMessageDiv.innerHTML = '🤖 <strong>AI Tutor:</strong><br><span class="streaming-text"></span>';
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        aiMessageDiv.appendChild(timeSpan);

        typingIndicator.classList.remove('show');
        chatMessages.insertBefore(aiMessageDiv, typingIndicator);
        const textSpan = aiMessageDiv.querySelector('.streaming-text');
        let fullResponse = '';

        try {
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: question,
                    subject: currentSubject
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let followUps = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            if (parsed.type === 'text') {
                                fullResponse += parsed.content;
                                textSpan.textContent = fullResponse;
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            } else if (parsed.type === 'follow_ups') {
                                followUps = parsed.content;
                                showFollowUps(followUps);
                            } else if (parsed.type === 'error') {
                                textSpan.textContent = '❌ Error: ' + parsed.content;
                            }
                        } catch (e) {}
                    }
                }
            }

            if (fullResponse) {
                addChatToHistory(question);
            }

        } catch (error) {
            textSpan.textContent = '❌ Network error: ' + error.message;
        }

        sendBtn.disabled = false;
        questionInput.focus();
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ============================================
    // ADD MESSAGE
    // ============================================
    function addMessage(type, content) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = content;
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.appendChild(time);
        chatMessages.insertBefore(div, typingIndicator);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ============================================
    // QUICK QUESTION
    // ============================================
    function quickQuestion(question) {
        questionInput.value = question;
        sendQuestion();
    }

    // ============================================
    // NEW CHAT
    // ============================================
    function newChat() {
        const messages = chatMessages.querySelectorAll('.message');
        messages.forEach(m => m.remove());
        const followUps = document.querySelectorAll('.follow-ups-container');
        followUps.forEach(f => f.remove());
        welcomeScreen.style.display = 'flex';
        questionInput.value = '';
        questionInput.focus();
        closeSidebar();
    }

    // ============================================
    // CHAT HISTORY
    // ============================================
    function addChatToHistory(question) {
        const title = question.length > 30 ? question.substring(0, 30) + '...' : question;
        const chatItem = document.createElement('div');
        chatItem.className = 'chat-item';
        chatItem.innerHTML = `
            <span class="icon">💬</span>
            <span class="title">${title}</span>
        `;
        chatItem.onclick = function() {
            // This is just for demo - we don't store full chat content
            // You could store full chat in memory if needed
        };
        chatList.prepend(chatItem);
        chatCounter++;
    }

    // ============================================
    // FOLLOW-UPS
    // ============================================
    function showFollowUps(suggestions) {
        const existing = document.querySelector('.follow-ups-container');
        if (existing) existing.remove();

        if (!suggestions || suggestions.length === 0) return;

        const container = document.createElement('div');
        container.className = 'follow-ups-container';
        container.innerHTML = `
            <div class="label">💡 Keep learning:</div>
            <div class="btn-group" id="followBtnGroup"></div>
        `;

        const btnGroup = container.querySelector('#followBtnGroup');
        suggestions.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'follow-btn';
            btn.textContent = s;
            btn.onclick = () => {
                questionInput.value = s;
                sendQuestion();
            };
            btnGroup.appendChild(btn);
        });

        chatMessages.insertBefore(container, typingIndicator);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ============================================
    // VOICE CHAT
    // ============================================
    function startVoice() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Voice chat is not supported in this browser. Please use Chrome!');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-NG';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function() {
            isRecording = true;
            voiceBtn.textContent = '🔴';
            voiceBtn.classList.add('recording');
            questionInput.placeholder = '🎤 Listening... speak now!';
        };

        recognition.onresult = function(event) {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            questionInput.value = transcript;
        };

        recognition.onend = function() {
            isRecording = false;
            voiceBtn.textContent = '🎤';
            voiceBtn.classList.remove('recording');
            questionInput.placeholder = 'Ask anything in Pidgin English...';
            if (questionInput.value.trim()) {
                sendQuestion();
            }
        };

        recognition.onerror = function(event) {
            isRecording = false;
            voiceBtn.textContent = '🎤';
            voiceBtn.classList.remove('recording');
            questionInput.placeholder = 'Ask anything in Pidgin English...';
            if (event.error === 'not-allowed') {
                alert('Please allow microphone access to use voice chat!');
            }
        };

        recognition.start();
    }

    // ============================================
    // SIDEBAR FUNCTIONS
    // ============================================
    function openSidebar() {
        document.getElementById('sidebar').classList.add('mobile-open');
        document.getElementById('sidebarOverlay').classList.add('show');
    }

    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('mobile-open');
        document.getElementById('sidebarOverlay').classList.remove('show');
    }

    // ============================================
    // KEYBOARD SHORTCUTS
    // ============================================
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'n') {
            e.preventDefault();
            newChat();
        }
        if (e.ctrlKey && e.key === 'v') {
            e.preventDefault();
            if (!isRecording) startVoice();
        }
        if (e.key === 'Escape') {
            closeSidebar();
        }
    });

    // ============================================
    // AUTO-FOCUS
    // ============================================
